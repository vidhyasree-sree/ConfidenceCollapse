
name: Deploy Confidence Collapse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: artifacts/confidence-collapse
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        working-directory: artifacts/confidence-collapse
        run: pnpm run build
        env:
          VITE_BASE_PATH: /ConfidenceCollapse/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/confidence-collapse/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
